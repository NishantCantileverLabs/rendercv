# yaml-language-server: $schema=../../../../../../schema.json
design:
  page:
    bottom_margin: 1.5cm
    left_margin: 1.5cm
    right_margin: 1.5cm
    show_footer: false
    show_top_note: false
    size: a4
    top_margin: 1.5cm
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
  section_titles:
    space_above: 10pt
    space_below: 4pt
  sections:
    show_time_spans_in: []
  theme: plain
  typography:
    alignment: justified
    font_family:
      body: Arial, Helvetica Neue, Liberation Sans, sans-serif
      connections: Arial, Helvetica Neue, Liberation Sans, sans-serif
      headline: Arial, Helvetica Neue, Liberation Sans, sans-serif
      name: Arial, Helvetica Neue, Liberation Sans, sans-serif
      section_titles: Arial, Helvetica Neue, Liberation Sans, sans-serif
    font_size:
      body: 10pt
      connections: 10pt
      headline: 10pt
      name: 28pt
      section_titles: 14pt
  templates:
    date_range: "START_DATE - END_DATE"
